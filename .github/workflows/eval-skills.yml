# Harness evals, SKILLS tier (content tier: no tools, no proxy) — its own status on every PR.
#
#   changed skill (.claude/skills/<name>/** or evals/skills/<name>/**) → evals/skills/<name>
#   a skill with no evals written → SKIP in the detect log, never a failure
#   this file → every skill eval; eval engine / shared eval CI → every tier
# Mapping: evals/scripts/ci-detect.mjs (EVAL_TIER=skills), via the reusable eval-detect.yml.
#
# Model knobs — first non-empty wins: manual run inputs → repo Variables EVAL_MODEL /
# EVAL_JUDGE_MODEL → the defaults below. Required secret: OPENROUTER_API_KEY.
name: eval-skills

on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - 'evals/skills/**'
      - 'evals/src/**'
      - 'evals/scripts/**'
      - 'evals/proxy/**'
      - 'evals/package.json'
      - 'evals/pnpm-lock.yaml'
      - 'evals/vitest.config.ts'
      - 'evals/tsconfig.json'
      - '.github/actions/evals-setup/**'
      - '.github/workflows/eval-detect.yml'
      - '.github/workflows/eval-skills.yml'
  workflow_dispatch:
    inputs:
      model:
        description: Model under test (OpenRouter slug); empty = repo variable or default
        default: ''
      judge_model:
        description: Judge model (OpenRouter slug); empty = repo variable or default
        default: ''

permissions:
  contents: read

concurrency:
  group: eval-skills-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter
  EVAL_MODEL: ${{ inputs.model || vars.EVAL_MODEL || 'anthropic/claude-haiku-5.5' }}
  EVAL_JUDGE_MODEL: ${{ inputs.judge_model || vars.EVAL_JUDGE_MODEL || 'deepseek/deepseek-v4.1-flash' }}

jobs:
  detect:
    uses: ./.github/workflows/eval-detect.yml
    with:
      tier: skills
      # A manual run evaluates every skill; a PR run only the skills its diff touches.
      scope: ${{ github.event_name == 'workflow_dispatch' && 'skills' || 'changed' }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  skills:
    needs: detect
    if: needs.detect.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        skill: ${{ fromJSON(needs.detect.outputs.targets) }}
    env:
      TARGET: ${{ matrix.skill }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/evals-setup
      - working-directory: evals
        # The key reaches only this step, not the setup / upload actions.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "model under test: $EVAL_MODEL · judge: $EVAL_JUDGE_MODEL"
          pnpm vitest run "skills/$TARGET/"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-skill-${{ matrix.skill }}
          path: evals/results/
          if-no-files-found: ignore
          retention-days: 14
