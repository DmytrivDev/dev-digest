# Harness evals (evals/) on OpenRouter — runs only the suites a PR actually affects.
#
#   changed skill  (.claude/skills/<name>/**)  → evals/skills/<name>   if evals exist, else SKIP in the log
#   changed agent  (.claude/agents/<name>.md)  → evals/agents/<name>   if evals exist, else SKIP — plus workflow tier
#   any CLAUDE.md, .claude settings/hooks/skill-routing, workflow cases → workflow tier
#   eval engine (evals/src, deps, proxy) or this file                   → full suite
# The mapping lives in evals/scripts/ci-detect.mjs (unit-tested in the `static` job).
#
# Model knobs — no code change needed, first non-empty wins:
#   manual run:   Actions → evals → Run workflow → `model` / `judge_model` / `scope`
#   every PR run: Settings → Secrets and variables → Actions → Variables → EVAL_MODEL / EVAL_JUDGE_MODEL
#   default:      below (anthropic/* needs no proxy; any other slug auto-starts the LiteLLM proxy)
# Required secret: OPENROUTER_API_KEY. Optional variable: EVAL_WORKFLOW_BLOCKING=true makes the
# workflow tier gate the merge (it is advisory by default — activation cases are behaviour-shaped).
name: evals

on:
  pull_request:
    paths:
      - '.claude/**'
      - '**/CLAUDE.md'
      - 'evals/**'
      - '.github/workflows/evals.yml'
      - '.github/actions/evals-setup/**'
  workflow_dispatch:
    inputs:
      scope:
        description: What to run
        type: choice
        options: [all, skills, agents, workflow]
        default: all
      model:
        description: Model under test (OpenRouter slug); empty = repo variable or default
        default: ''
      judge_model:
        description: Judge model (OpenRouter slug); empty = repo variable or default
        default: ''

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter
  EVAL_MODEL: ${{ inputs.model || vars.EVAL_MODEL || 'anthropic/claude-haiku-5.5' }}
  EVAL_JUDGE_MODEL: ${{ inputs.judge_model || vars.EVAL_JUDGE_MODEL || 'deepseek/deepseek-v4.1-flash' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      agents: ${{ steps.detect.outputs.agents }}
      run_workflow: ${{ steps.detect.outputs.run_workflow }}
      has_work: ${{ steps.detect.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the PR merge commit and its first parent (the base tip)

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: detect
        env:
          EVAL_SCOPE: ${{ inputs.scope || 'changed' }}
        run: |
          if [[ "$EVAL_SCOPE" == changed ]]; then
            export CHANGED_FILES="$(git diff --name-only HEAD^1 HEAD)"
          fi
          node evals/scripts/ci-detect.mjs
          echo "model under test : $EVAL_MODEL"
          echo "judge model      : $EVAL_JUDGE_MODEL"

      - name: Require the OpenRouter key when there is something to run
        if: steps.detect.outputs.has_work == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "::error::OPENROUTER_API_KEY is not set — add it under Settings → Secrets and variables → Actions"
            exit 1
          fi

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/evals-setup
      - working-directory: evals
        run: |
          node --test scripts/ci-detect.test.mjs
          pnpm typecheck
          pnpm eval:quality
          pnpm vitest run src/records/stats.test.ts

  skills:
    needs: detect
    if: needs.detect.outputs.skills != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        skill: ${{ fromJSON(needs.detect.outputs.skills) }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TARGET: ${{ matrix.skill }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/evals-setup
      - working-directory: evals
        run: pnpm vitest run "skills/$TARGET/"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-skill-${{ matrix.skill }}
          path: evals/results/
          if-no-files-found: ignore
          retention-days: 14

  agents:
    needs: detect
    if: needs.detect.outputs.agents != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1 # tool tiers get throttled by OpenRouter under load
      matrix:
        agent: ${{ fromJSON(needs.detect.outputs.agents) }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TARGET: ${{ matrix.agent }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/evals-setup
        with:
          proxy: 'true'
      - working-directory: evals
        run: pnpm vitest run "agents/$TARGET/"
      - if: failure()
        working-directory: evals
        run: docker compose -f proxy/docker-compose.yml logs --tail 100 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-agent-${{ matrix.agent }}
          path: evals/results/
          if-no-files-found: ignore
          retention-days: 14

  workflow:
    needs: detect
    if: needs.detect.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: ${{ vars.EVAL_WORKFLOW_BLOCKING != 'true' }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/evals-setup
        with:
          proxy: 'true'
      - working-directory: evals
        run: pnpm vitest run workflow/ --no-file-parallelism
      - if: failure()
        working-directory: evals
        run: docker compose -f proxy/docker-compose.yml logs --tail 100 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-workflow
          path: evals/results/
          if-no-files-found: ignore
          retention-days: 14
