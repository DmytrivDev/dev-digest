# Harness evals, AGENTS tier (tool tier: Claude Agent SDK, LiteLLM proxy for non-anthropic slugs)
# — its own status on every PR.
#
#   changed agent (.claude/agents/<name>.md or evals/agents/<name>/**) → evals/agents/<name>
#   an eval folder importing another's cases (an A/B variant) re-runs with it
#   an agent with no evals written → SKIP in the detect log, never a failure
#   this file → every agent eval; eval engine / shared eval CI → every tier
# A changed agent also re-runs the workflow tier — that is eval-workflow.yml's own status.
# Mapping: evals/scripts/ci-detect.mjs (EVAL_TIER=agents), via the reusable eval-detect.yml.
#
# Model knobs — first non-empty wins: manual run inputs → repo Variables EVAL_MODEL /
# EVAL_JUDGE_MODEL → the defaults below. Required secret: OPENROUTER_API_KEY.
name: eval-agents

on:
  pull_request:
    paths:
      - '.claude/agents/**'
      - 'evals/agents/**'
      - 'evals/src/**'
      - 'evals/scripts/**'
      - 'evals/proxy/**'
      - 'evals/package.json'
      - 'evals/pnpm-lock.yaml'
      - 'evals/vitest.config.ts'
      - 'evals/tsconfig.json'
      - '.github/actions/evals-setup/**'
      - '.github/workflows/eval-detect.yml'
      - '.github/workflows/eval-agents.yml'
  workflow_dispatch:
    inputs:
      model:
        description: Model under test (OpenRouter slug); empty = repo variable or default
        default: ''
      judge_model:
        description: Judge model (OpenRouter slug); empty = repo variable or default
        default: ''

permissions:
  contents: read

concurrency:
  group: eval-agents-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter
  EVAL_MODEL: ${{ inputs.model || vars.EVAL_MODEL || 'anthropic/claude-haiku-5.5' }}
  EVAL_JUDGE_MODEL: ${{ inputs.judge_model || vars.EVAL_JUDGE_MODEL || 'deepseek/deepseek-v4.1-flash' }}

jobs:
  detect:
    uses: ./.github/workflows/eval-detect.yml
    with:
      tier: agents
      # A manual run evaluates every agent; a PR run only the agents its diff touches.
      scope: ${{ github.event_name == 'workflow_dispatch' && 'agents' || 'changed' }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  agents:
    needs: detect
    if: needs.detect.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1 # tool tiers get throttled by OpenRouter under load
      matrix:
        agent: ${{ fromJSON(needs.detect.outputs.targets) }}
    env:
      TARGET: ${{ matrix.agent }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/evals-setup
        with:
          proxy: 'true'
          openrouter_key: ${{ secrets.OPENROUTER_API_KEY }} # the LiteLLM proxy needs it at startup
      - working-directory: evals
        # The key reaches only this step, not the setup / upload actions.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "model under test: $EVAL_MODEL · judge: $EVAL_JUDGE_MODEL"
          pnpm vitest run "agents/$TARGET/"
      - if: failure()
        working-directory: evals
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }} # compose interpolates it even for `logs`
        run: docker compose -f proxy/docker-compose.yml logs --tail 100 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-agent-${{ matrix.agent }}
          path: evals/results/
          if-no-files-found: ignore
          retention-days: 14
